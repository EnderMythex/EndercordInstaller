name: Release

on:
    push:
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

env:
    CARGO_TERM_COLOR: always
    ENDERCORD_INSTALLER_TAG: ${{ github.ref_name }}

jobs:
    windows:
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
            - run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
            - name: Build
              run: |
                  export ENDERCORD_INSTALLER_HASH=$(git rev-parse --short HEAD)
                  mkdir out
                  for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
                    suffix=$([ "$target" = aarch64-pc-windows-msvc ] && echo "-arm64" || echo "")
                    cargo build --release --target $target
                    cp target/$target/release/EndercordInstaller.exe out/EndercordInstaller$suffix.exe
                    cargo build --release --target $target --no-default-features
                    cp target/$target/release/EndercordInstaller.exe out/EndercordInstallerCli$suffix.exe
                  done
            - uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: out/*

    macos:
        runs-on: macos-latest
        env:
            MACOSX_DEPLOYMENT_TARGET: "10.13"
        steps:
            - uses: actions/checkout@v4
            - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
            - name: Build
              run: |
                  export ENDERCORD_INSTALLER_HASH=$(git rev-parse --short HEAD)
                  mkdir out
                  for target in x86_64-apple-darwin aarch64-apple-darwin; do
                    cargo build --release --target $target
                    cp target/$target/release/EndercordInstaller gui-$target
                    cargo build --release --target $target --no-default-features
                    cp target/$target/release/EndercordInstaller cli-$target
                  done
                  lipo -create -output out/EndercordInstallerCli-universal cli-x86_64-apple-darwin cli-aarch64-apple-darwin

                  app="EnderCord Installer.app"
                  mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
                  cp macos/Info.plist "$app/Contents/Info.plist"
                  cp macos/icon.icns "$app/Contents/Resources/icon.icns"
                  lipo -create -output "$app/Contents/MacOS/EndercordInstaller" gui-x86_64-apple-darwin gui-aarch64-apple-darwin
                  codesign --force --deep --sign - "$app"
                  ditto -c -k --keepParent "$app" out/EndercordInstaller-macos.zip
            - uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: out/*

    linux:
        strategy:
            matrix:
                include:
                    - runner: ubuntu-22.04
                      suffix: ""
                    - runner: ubuntu-22.04-arm
                      suffix: "-arm64"
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4
            - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
            - name: Build
              run: |
                  export ENDERCORD_INSTALLER_HASH=$(git rev-parse --short HEAD)
                  mkdir out
                  cargo build --release
                  cp target/release/EndercordInstaller out/EndercordInstaller-linux${{ matrix.suffix }}
                  cargo build --release --no-default-features
                  cp target/release/EndercordInstaller out/EndercordInstallerCli-linux${{ matrix.suffix }}
                  chmod +x out/*
            - uses: actions/upload-artifact@v4
              with:
                  name: linux${{ matrix.suffix }}
                  path: out/*

    release:
        needs: [windows, macos, linux]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}" dist/* \
                    --repo "${{ github.repository }}" \
                    --title "EnderCord Installer ${{ github.ref_name }}" \
                    --generate-notes
