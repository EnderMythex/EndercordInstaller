[package]
name = "endercord-installer"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Installer for EnderCord, a Discord client mod"
repository = "https://github.com/EnderMythex/EndercordInstaller"

[[bin]]
name = "EndercordInstaller"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "native-certs"] }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
